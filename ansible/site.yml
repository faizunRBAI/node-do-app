---
- name: Configure Node.js app server
  hosts: droplet
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/node-do-app
    app_user: appuser
    node_version: "20"

  tasks:
    - name: Wait for SSH to become available
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 5
        timeout: 120
      delegate_to: localhost
      become: false

    - name: Wait for apt lock to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false
      retries: 12
      delay: 10

    - name: Update apt cache (no cache_valid_time — host is freshly provisioned)
      ansible.builtin.apt:
        update_cache: true

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - nginx
        state: present

    - name: Add NodeSource GPG key
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
          | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args:
        creates: /etc/apt/keyrings/nodesource.gpg

    - name: Add NodeSource repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_version }}.x nodistro main"
        state: present
        filename: nodesource

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Install PM2 globally
      ansible.builtin.shell: npm install -g pm2
      args:
        creates: /usr/bin/pm2

    - name: Create app user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: false

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy package.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../package.json"
        dest: "{{ app_dir }}/package.json"
        owner: root
        group: root
        mode: "0644"
      notify: Restart app

    - name: Copy package-lock.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../package-lock.json"
        dest: "{{ app_dir }}/package-lock.json"
        owner: root
        group: root
        mode: "0644"
      notify: Restart app

    - name: Copy tsconfig.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tsconfig.json"
        dest: "{{ app_dir }}/tsconfig.json"
        owner: root
        group: root
        mode: "0644"

    - name: Copy nest-cli.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../nest-cli.json"
        dest: "{{ app_dir }}/nest-cli.json"
        owner: root
        group: root
        mode: "0644"

    - name: Create src directory on server
      ansible.builtin.file:
        path: "{{ app_dir }}/src"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy src/app.controller.ts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../src/app.controller.ts"
        dest: "{{ app_dir }}/src/app.controller.ts"
        owner: root
        group: root
        mode: "0644"
      notify: Restart app

    - name: Copy src/app.module.ts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../src/app.module.ts"
        dest: "{{ app_dir }}/src/app.module.ts"
        owner: root
        group: root
        mode: "0644"
      notify: Restart app

    - name: Copy src/app.service.ts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../src/app.service.ts"
        dest: "{{ app_dir }}/src/app.service.ts"
        owner: root
        group: root
        mode: "0644"
      notify: Restart app

    - name: Copy src/main.ts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../src/main.ts"
        dest: "{{ app_dir }}/src/main.ts"
        owner: root
        group: root
        mode: "0644"
      notify: Restart app

    - name: Copy src/welcome.ts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../src/welcome.ts"
        dest: "{{ app_dir }}/src/welcome.ts"
        owner: root
        group: root
        mode: "0644"
      notify: Restart app

    - name: Install npm dependencies
      ansible.builtin.shell: npm ci
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Build NestJS application
      ansible.builtin.shell: ./node_modules/.bin/nest build
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Set ownership of app directory to app user
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Start app with PM2
      ansible.builtin.shell: |
        pm2 describe node-do-app > /dev/null 2>&1 \
          && pm2 reload node-do-app \
          || pm2 start {{ app_dir }}/dist/main.js --name node-do-app --uid {{ app_user }} --gid {{ app_user }}
      changed_when: true

    - name: Save PM2 process list
      ansible.builtin.shell: pm2 save
      changed_when: true

    - name: Setup PM2 startup on boot
      ansible.builtin.shell: pm2 startup systemd -u root --hp /root
      register: pm2_startup
      changed_when: pm2_startup.rc == 0

    - name: Enable PM2 systemd service
      ansible.builtin.shell: "{{ pm2_startup.stdout_lines | select('match', '^sudo') | first }}"
      when: pm2_startup.stdout_lines | select('match', '^sudo') | list | length > 0
      changed_when: true

    - name: Wait for app to listen on port 3000
      ansible.builtin.wait_for:
        port: 3000
        delay: 5
        timeout: 60

    - name: Configure Nginx virtual host
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/node-do-app
        content: |
          server {
            listen 80 default_server;
            listen [::]:80 default_server;

            server_name _;

            client_max_body_size 16M;

            location / {
              proxy_pass         http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header   Upgrade $http_upgrade;
              proxy_set_header   Connection 'upgrade';
              proxy_set_header   Host $host;
              proxy_set_header   X-Real-IP $remote_addr;
              proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $scheme;
              proxy_cache_bypass $http_upgrade;
            }
          }
        mode: "0644"
      notify: Reload nginx

    - name: Enable Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/node-do-app
        dest: /etc/nginx/sites-enabled/node-do-app
        state: link
      notify: Reload nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Flush handlers (nginx reload)
      ansible.builtin.meta: flush_handlers

    - name: Allow SSH via ufw
      ansible.builtin.shell: ufw allow 22/tcp
      changed_when: true

    - name: Allow HTTP via ufw
      ansible.builtin.shell: ufw allow 80/tcp
      changed_when: true

    - name: Enable ufw
      ansible.builtin.shell: echo y | ufw enable
      changed_when: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart app
      ansible.builtin.shell: |
        pm2 describe node-do-app > /dev/null 2>&1 && pm2 reload node-do-app || true
      changed_when: true
