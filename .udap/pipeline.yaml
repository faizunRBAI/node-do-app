version: 1
name: node-do-app
vcs: github

# Terraform remote state lives in a DigitalOcean Space (S3-COMPATIBLE, not AWS
# S3). The s3 backend therefore needs the Spaces endpoint plus the
# compatibility skips below — without them terraform talks to real AWS S3 and
# the deploy dies at `terraform init`. The Spaces credentials are surfaced to
# terraform under their AWS_* env names because that is what the s3 backend
# reads; the backend region is derived from the endpoint host so the two can
# never drift apart.

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 10
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_SPACE }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${host%%.*}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
        working-directory: infra
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 20
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
    steps:
      - name: Install Ansible
        # ansible-core ships no third-party collections; npm and ufw both live
        # in community.general, so the playbook cannot resolve them without it.
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.general
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_SPACE }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${host%%.*}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
        working-directory: infra
      - name: Get Droplet IP
        id: get_ip
        run: echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if nc -z -w 5 "${{ steps.get_ip.outputs.droplet_ip }}" 22; then
              echo "SSH is up"; exit 0
            fi
            echo "waiting for sshd ($i/30)"; sleep 10
          done
          echo "sshd never came up"; exit 1
      - name: Scan host key
        run: ssh-keyscan -H "${{ steps.get_ip.outputs.droplet_ip }}" >> ~/.ssh/known_hosts
      - name: Generate inventory
        run: |
          echo "[droplet]" > inventory.ini
          echo "${{ steps.get_ip.outputs.droplet_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key" >> inventory.ini
      - name: Run Ansible playbook
        run: ansible-playbook -i inventory.ini ansible/site.yml

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 10
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_SPACE }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${host%%.*}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
        working-directory: infra
      - name: Get Droplet IP
        id: get_ip
        run: echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.droplet_ip }}

destroy:
  env:
    DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
    AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
    AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
    - name: Terraform destroy
      run: |
        host="${AWS_ENDPOINT_URL_S3#https://}"
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_SPACE }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=${host%%.*}" \
          -backend-config="skip_credentials_validation=true" \
          -backend-config="skip_requesting_account_id=true" \
          -backend-config="skip_metadata_api_check=true" \
          -backend-config="skip_region_validation=true" \
          -backend-config="skip_s3_checksum=true" \
          -backend-config="use_path_style=true"
        terraform destroy -input=false -auto-approve
      working-directory: infra

rollback:
  strategy: manual
