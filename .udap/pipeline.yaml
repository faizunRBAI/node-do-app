version: 1
name: node-do-app
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 10
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
    outputs:
      droplet_ip: ${{ steps.tf_output.outputs.droplet_ip }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoint=https://nyc3.digitaloceanspaces.com" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="force_path_style=true"
        working-directory: infra
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra
      - name: Get Droplet IP
        id: tf_output
        run: echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 20
    steps:
      - name: Install Ansible
        run: pip install ansible-core
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Scan host key
        run: ssh-keyscan -H "${{ needs.provision.outputs.droplet_ip }}" >> ~/.ssh/known_hosts
      - name: Generate inventory
        run: |
          echo "[droplet]" > inventory.ini
          echo "${{ needs.provision.outputs.droplet_ip }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/deploy_key" >> inventory.ini
      - name: Run Ansible playbook
        run: ansible-playbook -i inventory.ini ansible/site.yml

  - id: verify
    kind: verify
    needs: [provision, configure]
    timeout_minutes: 10
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="endpoint=https://nyc3.digitaloceanspaces.com" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="force_path_style=true"
        working-directory: infra
      - name: Get Droplet IP
        id: get_ip
        run: echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra
      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors \
            http://${{ steps.get_ip.outputs.droplet_ip }}

rollback:
  strategy: manual
